<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ParseLab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231F3A5F'/%3E%3Crect x='9' y='9' width='14' height='14' rx='4' fill='%23F2F0E7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* ===== Tokens — DESIGN-parselab.md ===== */
  :root {
    color-scheme: light;
    --navy:#1F3A5F; --navy-alt:#1A3253; --ink-deep:#16293F;
    --cream:#F2F0E7; --cream-white:#FBFAF6; --white:#FFFFFF;
    --on-dark:#F2F0E7; --on-dark-muted:rgba(242,240,231,.72); --on-dark-faint:rgba(242,240,231,.58); --on-dark-label:rgba(242,240,231,.48);
    --ink:#16293F; --muted:#6B7A8C; --hairline:#E6E3D8;
    --gold:#C9A961; --gold-tint:#EDE7D5; --blue:#2C6FA8; --blue-tint:#DCE8F2;
    --chip-dark:rgba(242,240,231,.16); --nav-active:rgba(242,240,231,.14);
    --shadow-light:0 18px 44px rgba(6,18,35,.10); --shadow-dark:0 24px 60px rgba(6,18,35,.28);
    --font:Poppins,-apple-system,"Segoe UI",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--font); -webkit-font-smoothing:antialiased; color:var(--ink); background:var(--cream-white); font-size:16px; line-height:1.55; }
  a { color:var(--ink); text-decoration:none; }
  button { font-family:inherit; font-size:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline:2px solid var(--gold); outline-offset:3px; border-radius:14px; }
  [hidden] { display:none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; } }

  .caps { font-size:13px; font-weight:500; letter-spacing:.02em; text-transform:uppercase; line-height:1.2; color:var(--muted); }
  .caps-nav { font-size:13px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; }
  .mono { font-family:var(--mono); font-size:13px; letter-spacing:.02em; }
  .mono-12 { font-family:var(--mono); font-size:12px; letter-spacing:.02em; color:var(--muted); }
  .title-24 { font-size:24px; font-weight:600; line-height:1.25; letter-spacing:-.01em; text-wrap:balance; }
  .note { font-size:15px; line-height:1.5; color:var(--muted); text-wrap:pretty; }
  .strong { font-weight:500; color:var(--ink); }

  /* ===== Shell ===== */
  .shell { display:grid; grid-template-columns:272px 1fr; min-height:100vh; }
  .side { background:var(--navy); padding:32px 20px; display:flex; flex-direction:column; gap:32px; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .logo { display:flex; align-items:center; gap:12px; padding:0 8px; border-radius:14px; }
  .logo-mark { width:26px; height:26px; border-radius:9px; background:var(--cream); display:block; flex:none; }
  .logo-word { font-size:19px; font-weight:600; letter-spacing:-.02em; color:var(--on-dark); }
  .group { display:flex; flex-direction:column; gap:6px; }
  .group-label { padding:0 8px 6px; color:var(--on-dark-label); }
  .nav-item { display:flex; align-items:center; gap:12px; width:100%; text-align:left; font-size:16px; font-weight:500; border-radius:14px; padding:12px 14px; color:var(--on-dark-muted); transition:background 150ms ease-out; }
  .nav-item:hover { background:rgba(242,240,231,.08); }
  .nav-item[aria-current="page"] { background:var(--nav-active); color:var(--on-dark); }
  .nav-item .label { flex:1; }
  .nav-item .meta { font-size:12px; font-weight:500; color:var(--on-dark-muted); border-radius:999px; padding:2px 9px; background:var(--chip-dark); white-space:nowrap; }
  .nav-sub { display:flex; flex-direction:column; gap:2px; padding:2px 0 6px 0; }
  .nav-sub-item { display:flex; align-items:center; gap:10px; width:100%; text-align:left; font-size:15px; font-weight:500; border-radius:14px; padding:9px 14px 9px 52px; color:var(--on-dark-muted); transition:background 150ms ease-out; }
  .nav-sub-item:hover { background:rgba(242,240,231,.08); }
  .nav-sub-item[aria-current="page"] { background:var(--nav-active); color:var(--on-dark); }
  .nav-sub-item[disabled] { color:var(--on-dark-label); cursor:default; }
  .nav-sub-item[disabled]:hover { background:transparent; }
  .nav-sub-item .idx { font-family:var(--mono); font-size:12px; width:16px; flex:none; }
  .nav-proj-label { padding:10px 14px 4px 52px; color:var(--on-dark-label); font-size:12px; letter-spacing:.06em; text-transform:uppercase; font-weight:500; }
  .nav-sub-item.proj { font-weight:400; }
  .nav-sub-item.proj .pdot { width:6px; height:6px; border-radius:999px; background:var(--gold); flex:none; }
  .nav-sub-item.proj span:not(.pdot) { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-sub-item.new { color:var(--on-dark-label); }
  .dot { width:8px; height:8px; border-radius:999px; display:block; flex:none; }
  .tile { border-radius:9px; color:var(--ink-deep); font-family:var(--mono); display:flex; align-items:center; justify-content:center; flex:none; }
  .tile-26 { width:26px; height:26px; font-size:11px; }
  .tile-36 { width:36px; height:36px; border-radius:14px; font-size:13px; }
  .spacer { flex:1; }
  .user-wrap { position:relative; }
  .user { display:flex; align-items:center; gap:12px; padding:8px; width:100%; text-align:left; border-radius:14px; transition:background 150ms ease-out; }
  .user:hover { background:rgba(242,240,231,.08); }
  .avatar { width:36px; height:36px; border-radius:999px; background:var(--gold); color:var(--ink-deep); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; flex:none; }
  .user-name { font-size:15px; font-weight:500; color:var(--on-dark); }
  .user-mail { font-size:13px; color:var(--on-dark-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .menu { position:absolute; left:8px; right:8px; bottom:calc(100% + 8px); background:var(--white); border-radius:14px; box-shadow:var(--shadow-dark); padding:8px; display:flex; flex-direction:column; gap:2px; z-index:20; }
  .menu button { display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 12px; border-radius:9px; font-size:15px; font-weight:500; color:var(--ink); }
  .menu button:hover { background:var(--cream); }

  .work { padding:32px 48px 64px; display:flex; flex-direction:column; gap:32px; max-width:1240px; width:100%; min-width:0; }
  .topbar { display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
  .topbar-text { display:flex; flex-direction:column; gap:6px; flex:1; min-width:240px; }
  .topbar-text .caps-nav { color:var(--muted); }
  .topbar-text h1 { font-size:34px; font-weight:700; letter-spacing:-.01em; line-height:1.1; text-wrap:balance; }
  .topbar-text .sub { font-size:16px; color:var(--muted); }
  .topbar-actions { display:flex; align-items:center; gap:12px; }
  .search { background:var(--white); border-radius:14px; padding:13px 18px; font-size:15px; color:var(--ink); box-shadow:var(--shadow-light); min-width:260px; border:0; font-family:inherit; }
  .search::placeholder { color:var(--muted); }

  .btn { display:inline-flex; align-items:center; gap:12px; font-size:16px; font-weight:600; line-height:1; border-radius:14px; padding:15px 24px; transition:transform 150ms ease-out, filter 150ms ease-out; white-space:nowrap; }
  .btn:hover { transform:translateY(-1px); filter:brightness(1.03); }
  .btn .arrow { transition:transform 150ms ease-out; }
  .btn:hover .arrow { transform:translateX(4px); }
  .btn-navy { background:var(--navy); color:var(--on-dark); }
  .btn-outline { background:var(--white); color:var(--navy); border:1px solid var(--navy); padding:14px 20px; }
  .btn-small { padding:10px 16px; font-size:15px; }
  .link { font-size:15px; font-weight:600; color:var(--blue); }

  .card { background:var(--white); border-radius:20px; padding:28px; box-shadow:var(--shadow-light); display:flex; flex-direction:column; gap:16px; min-width:0; }
  .card-head { display:flex; align-items:center; gap:12px; }
  .card-head .caps { flex:1; }
  .hairline { height:1px; background:var(--hairline); }
  .stack { display:flex; flex-direction:column; gap:2px; }
  .lock { display:inline-flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); }
  .lock .ico { width:16px; height:16px; flex:none; }
  .pill { display:inline-flex; align-items:center; border-radius:999px; padding:4px 12px; font-size:13px; font-weight:500; line-height:1.4; white-space:nowrap; }
  .pill-live { background:var(--blue-tint); color:var(--blue); }
  .pill-neutral { background:var(--cream); color:var(--ink-deep); }

  /* ===== Overzicht (ParseLab Start): navy kaarten met een mini-visual per tool ===== */
  .overview-title h1 { font-size:52px; letter-spacing:-.02em; line-height:1.05; color:var(--navy); }
  .overview-title .sub { font-size:19px; }
  .launch { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:22px; }
  .launch button { display:flex; flex-direction:column; gap:18px; text-align:left; background:var(--navy); color:#fff; border-radius:20px; padding:24px; box-shadow:0 18px 40px rgba(31,58,95,.18); transition:transform 180ms ease, box-shadow 180ms ease; }
  .launch button:hover { transform:translateY(-4px); box-shadow:0 26px 54px rgba(31,58,95,.26); }
  .launch .lh { display:flex; align-items:center; justify-content:space-between; width:100%; }
  .launch .ltile { width:38px; height:38px; border-radius:999px; color:var(--navy); font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center; font-family:var(--font); }
  .launch .lt { font-size:21px; font-weight:600; line-height:1.2; }
  .launch .ls { font-size:14px; color:#A9BAD0; margin-top:8px; line-height:1.45; }
  .launch .lv { margin-top:auto; width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:12px; position:relative; overflow:hidden; height:96px; }
  .lv .rowl { display:flex; align-items:center; gap:6px; }
  .lv .lab { width:26px; height:5px; border-radius:3px; background:rgba(255,255,255,.22); flex:none; }
  .lv .fld { flex:1; height:14px; border-radius:5px; background:rgba(255,255,255,.14); }
  .lv .fld.on { background:#CFDCEA; display:flex; align-items:center; padding:0 5px; }
  .lv .caret { width:2px; height:8px; background:var(--navy); animation:pl-caret 2.6s infinite; }
  .lv .chip { position:absolute; left:14px; bottom:8px; font-family:var(--mono); font-size:9px; color:var(--navy); background:var(--gold); border-radius:4px; padding:2px 6px; animation:pl-fill 2.6s infinite; }
  .lv .scan { flex:1; position:relative; overflow:hidden; display:flex; flex-direction:column; gap:7px; }
  .lv .scan i { display:block; height:12px; border-radius:4px; background:rgba(255,255,255,.13); }
  .lv .scan .beam { position:absolute; inset:0 0 auto 0; height:12px; border-radius:4px; border:1.5px solid var(--gold); background:rgba(201,169,97,.18); animation:pl-scan 2.4s cubic-bezier(.6,0,.4,1) infinite alternate; }
  .lv .arr { width:16px; display:flex; align-items:center; justify-content:center; color:#8D9AAB; font-size:11px; }
  .lv .rows { flex:1; display:grid; grid-template-rows:repeat(4,1fr); gap:7px; }
  .lv .rows i { display:block; border-radius:4px; background:rgba(207,220,234,.85); animation:pl-row 2.4s infinite; }
  .lv .rows i:nth-child(2) { opacity:.85; animation-delay:.2s; } .lv .rows i:nth-child(3) { opacity:.7; animation-delay:.4s; } .lv .rows i:nth-child(4) { opacity:.55; animation-delay:.6s; }
  .lv .doc { width:44px; background:rgba(255,255,255,.1); border-radius:5px; padding:6px; display:flex; flex-direction:column; gap:4px; }
  .lv .doc i { display:block; height:4px; border-radius:2px; background:rgba(255,255,255,.2); }
  .lv .doc i.t { width:70%; background:rgba(255,255,255,.4); } .lv .doc i.g { background:var(--gold); width:80%; } .lv .doc i.g2 { background:var(--gold); width:55%; }
  .lv .tbl { flex:1; display:flex; flex-direction:column; gap:5px; font-family:var(--mono); font-size:8px; color:var(--navy); }
  .lv .tbl .tr2 { display:flex; gap:4px; } .lv .tbl .tr2 > i { display:flex; align-items:center; padding-left:3px; flex:1; background:rgba(255,255,255,.2); border-radius:3px; height:12px; font-style:normal; }
  .lv .tbl .tr2 > i.k { flex:none; width:22px; padding:0; } .lv .tbl .tr2.h > i.k { background:rgba(255,255,255,.2); }
  .lv .tbl .tr2.d { animation:pl-row 2.6s infinite; } .lv .tbl .tr2.d > i { background:#EDEFF3; } .lv .tbl .tr2.d > i.k { background:var(--gold); }
  .lv .tbl .tr2.d2 { animation-delay:.25s; } .lv .tbl .tr2.d3 { animation-delay:.5s; } .lv .tbl .tr2.d3 > i { background:rgba(237,239,243,.65); } .lv .tbl .tr2.d3 > i.k { background:rgba(201,169,97,.6); }
  .lv .bars { display:flex; align-items:flex-end; gap:5px; height:44px; }
  .lv .bars i { flex:1; display:block; border-radius:3px 3px 0 0; background:rgba(207,220,234,.6); transform-origin:bottom; animation:pl-grow .9s ease-out both; }
  .lv .bars i.g { background:var(--gold); }
  .lv .spark { display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
  .lv .spark path { stroke-dasharray:140; stroke-dashoffset:140; animation:pl-dash 1.4s ease-out .3s forwards; }
  .lv .spark span { font-family:var(--mono); font-size:9px; color:#CFDCEA; }
  @keyframes pl-fill { 0%,12% { transform:translate(0,0); opacity:0; } 20% { opacity:1; } 60% { transform:translate(58px,-22px); opacity:1; } 72%,100% { transform:translate(58px,-22px); opacity:0; } }
  @keyframes pl-caret { 0%,55% { opacity:0; } 62%,100% { opacity:1; } }
  @keyframes pl-scan { 0% { transform:translateY(0); } 100% { transform:translateY(34px); } }
  @keyframes pl-row { 0%,20% { opacity:.18; transform:translateX(-6px); } 40%,100% { opacity:1; transform:translateX(0); } }
  @keyframes pl-grow { 0% { transform:scaleY(.15); } 100% { transform:scaleY(1); } }
  @keyframes pl-dash { to { stroke-dashoffset:0; } }
  @media (prefers-reduced-motion: reduce) { .lv * { animation:none !important; } .lv .spark path { stroke-dashoffset:0; } }
  .proj-row .pname { font-size:19px; font-weight:600; color:var(--navy); overflow-wrap:anywhere; white-space:normal; }
  .proj-row .ptool { display:flex; align-items:center; gap:16px; }
  .proj-row .mini { display:flex; align-items:flex-end; gap:2px; height:20px; }
  .proj-row .mini i { display:block; width:4px; border-radius:1px; background:#DDE4EC; }
  .proj-row .mini i.m { background:#C6D2E0; } .proj-row .mini i.d { background:var(--navy); }
  .btn-pill { border:1.5px solid var(--navy); color:var(--navy); border-radius:999px; padding:10px 22px; font-size:15px; font-weight:600; background:var(--white); transition:background 150ms ease, color 150ms ease; }
  .btn-pill:hover { background:var(--navy); color:#fff; }
  .table { display:flex; flex-direction:column; }
  .tr { display:grid; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--hairline); width:100%; text-align:left; color:var(--ink); }
  .proj-row { grid-template-columns:minmax(0,1.6fr) 220px auto auto; padding:20px 0; }
  .files-row { grid-template-columns:1.6fr 1fr auto; }
  .cell-main { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .cell-main > span:first-child { font-size:16px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cell-tool { display:flex; align-items:center; gap:8px; font-size:15px; color:var(--muted); }
  .empty { padding:8px 0; }

  /* ===== Werkbank ===== */
  .bench { padding:0; overflow:hidden; gap:0; }
  .bench-frame { width:100%; height:calc(100vh - 150px); min-height:720px; border:0; display:block; background:var(--cream-white); }
  .bench-body { padding:28px; display:grid; grid-template-columns:1.2fr 1fr; gap:32px; align-items:start; }
  .bench-actions { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .bench-note { background:var(--cream); border-radius:14px; padding:16px 20px; display:flex; flex-direction:column; gap:8px; }
  .bench-side { display:flex; flex-direction:column; gap:24px; }
  .steps { display:flex; flex-direction:column; gap:14px; }
  .step { display:flex; gap:14px; align-items:flex-start; }
  .step-n { width:28px; height:28px; border-radius:9px; background:var(--cream); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; flex:none; }
  .step .stack > span:first-child { font-size:16px; font-weight:500; }
  details.it { border-top:1px solid var(--hairline); padding-top:16px; }
  details.it summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; color:var(--muted); }
  details.it summary::-webkit-details-marker { display:none; }
  details.it summary::after { content:"+"; font-family:var(--mono); margin-left:auto; }
  details.it[open] summary::after { content:"−"; }
  details.it > div { display:flex; flex-direction:column; gap:16px; padding-top:16px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; align-items:baseline; }

  /* ===== Hulp ===== */
  .help-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:24px; }
  .help-card ol { padding-left:20px; display:flex; flex-direction:column; gap:8px; font-size:15px; color:var(--muted); }
  .help-card li span { color:var(--ink); font-weight:500; }

  /* ===== Modal ===== */
  .modal-bg { position:fixed; inset:0; background:rgba(6,18,35,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; }
  .modal { background:var(--white); border-radius:20px; padding:28px; box-shadow:var(--shadow-dark); width:min(560px, 100%); display:flex; flex-direction:column; gap:16px; max-height:90vh; overflow:auto; }
  .modal .foot { display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-size:13px; font-weight:500; letter-spacing:.02em; text-transform:uppercase; color:var(--muted); }
  .field input { border:1px solid var(--hairline); border-radius:14px; padding:13px 16px; font-size:16px; font-family:inherit; color:var(--ink); background:var(--white); }
  .field input:focus { outline:0; border-color:var(--blue); background:var(--blue-tint); }
  .toggle { display:flex; gap:12px; align-items:flex-start; cursor:pointer; }
  .toggle input { margin-top:5px; width:18px; height:18px; accent-color:var(--navy); flex:none; }
  .server-hint { background:var(--cream); border-radius:14px; padding:14px 18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .server-hint .ico { width:18px; height:18px; flex:none; color:var(--muted); }
  .server-hint code { font-family:var(--mono); font-size:13px; background:var(--white); padding:2px 8px; border-radius:9px; }

  /* ===== Login ===== */
  .login { min-height:100vh; display:grid; grid-template-columns:1fr 1fr; }
  .login-left { background:var(--navy); color:var(--on-dark); padding:64px; display:flex; flex-direction:column; gap:32px; justify-content:center; }
  .login-left h1 { font-size:48px; font-weight:700; line-height:1.1; letter-spacing:-.02em; max-width:16ch; text-wrap:balance; }
  .login-left p { font-size:19px; color:var(--on-dark-muted); max-width:46ch; }
  .login-right { display:flex; align-items:center; justify-content:center; padding:48px; }
  .login-card { width:min(440px, 100%); gap:20px; }
  .login .btn { justify-content:center; }

  @media (max-width: 1100px) { .bench-body { grid-template-columns:1fr; } .help-grid { grid-template-columns:1fr; } .login { grid-template-columns:1fr; } .login-left { padding:40px 24px; } }
  @media (max-width: 860px) {
    .shell { grid-template-columns:1fr; }
    .side { position:static; height:auto; padding:20px; gap:20px; }
    .side .spacer { display:none; }
    .work { padding:24px 20px 48px; }
    .bench-frame { height:80vh; min-height:560px; }
    .topbar-text h1 { font-size:28px; }
    .proj-row, .files-row { grid-template-columns:1fr auto; }
    .proj-row > .cell-tool, .files-row > .cell-tool { display:none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";
/* =========================================================================
   ParseLab — één schil voor ParseForm, ParseScraper, ParsePDF en ParseBoard.
   Geen voorbeelddata: alles wat je ziet komt uit de tools zelf (projecten, taken, sjablonen, bestanden).
   state.view = overview | files | help | form | scrape | pdf | board ; state.section = stap in de tool ; state.project = geopend project.
   ========================================================================= */

const CONFIG = { webstoreUrl: "", lang: "nl", apiBase: "" };
const TONE = { form:{ tile:"#DCE8F2", dot:"#2C6FA8" }, scrape:{ tile:"#EDE7D5", dot:"#C9A961" }, pdf:{ tile:"#F2F0E7", dot:"#6B7A8C" }, board:{ tile:"#D8D5C8", dot:"#16293F" } };

/* ---------- sessie: inloglink per e-mail; zonder backend start de sessie op deze computer ---------- */
const SESSION_KEY = "parselab-session";
function readSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (e) { return null; } }
function writeSession(s) { try { if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); } catch (e) {} }
function userFromEmail(email) {
  const particles = ["de", "van", "der", "den", "het", "te", "ten", "ter", "op", "in"];
  const local = String(email).split("@")[0].replace(/[._-]+/g, " ").trim();
  const name = local ? local.split(" ").map((w, i) => (i > 0 && particles.includes(w.toLowerCase())) ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1)).join(" ") : "Gebruiker";
  return { email, name, initials: name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase() };
}

/* ---------- projecten: bewaarde eenheden van werk per tool; de tools melden ze via postMessage ---------- */
const PROJECTS_KEY = "parselab-projects";
function readProjects() { try { return JSON.parse(localStorage.getItem(PROJECTS_KEY) || "[]"); } catch (e) { return []; } }
function writeProjects(list) { try { localStorage.setItem(PROJECTS_KEY, JSON.stringify(list.slice(0, 200))); } catch (e) {} }
function upsertProject(pr) {
  const list = readProjects(); const i = list.findIndex(x => x.id === pr.id);
  const cur = Object.assign({ created: new Date().toISOString() }, i >= 0 ? list[i] : {}, pr, { updated: pr.updated || new Date().toISOString() });
  if (i >= 0) list[i] = cur; else list.unshift(cur);
  writeProjects(list); return cur;
}
/* Naam en "uit lijst" die jij in het dashboard kiest, winnen van wat de tool later meldt; de tool krijgt het ook te horen. */
const OVERRIDE_KEY = "parselab-project-overrides";
function readOverrides() { try { return JSON.parse(localStorage.getItem(OVERRIDE_KEY) || "{}") || {}; } catch (e) { return {}; } }
function writeOverride(id, patch) { const o = readOverrides(); o[id] = Object.assign({}, o[id] || {}, patch); try { localStorage.setItem(OVERRIDE_KEY, JSON.stringify(o)); } catch (e) {} }
function tellTool(msg) { const f = document.querySelector("iframe.bench-frame"); if (!f) return; try { f.contentWindow.postMessage(Object.assign({ source:"parselab-dashboard" }, msg), "*"); } catch (e) {} }
function renameProject(id, name) { writeOverride(id, { name, pending:"rename" }); upsertProject({ id, name }); flushOverrides(); }
function deleteProject(id) { writeOverride(id, { hidden:true, pending:"delete" }); writeProjects(readProjects().filter(x => x.id !== id)); flushOverrides(); }
/* Wijzigingen gaan naar de tool zodra die open staat (vanuit het overzicht is er geen tool geladen). */
function flushOverrides() {
  const f = document.querySelector("iframe.bench-frame"); if (!f || f.dataset.ready !== "1") return;
  const o = readOverrides(); let changed = false;
  Object.keys(o).forEach(id => { const x = o[id]; if (!x.pending || id.split(":")[0] !== f.dataset.tool) return; tellTool(x.pending === "delete" ? { type:"parselab:delete-project", id } : { type:"parselab:rename-project", id, name:x.name }); delete x.pending; changed = true; });
  if (changed) { try { localStorage.setItem(OVERRIDE_KEY, JSON.stringify(o)); } catch (e) {} }
}
function syncProjects(tool, incoming) {
  const ov = readOverrides();
  incoming = (incoming || []).filter(pr => !(ov[pr.id] && ov[pr.id].hidden)).map(pr => (ov[pr.id] && ov[pr.id].name) ? Object.assign({}, pr, { name: ov[pr.id].name }) : pr);
  const ids = new Set(incoming.map(x => x.id));
  const list = readProjects().filter(x => !(x.tool === tool && x.synced) && !ids.has(x.id));
  incoming.forEach(pr => { const prev = readProjects().find(x => x.id === pr.id); list.push(Object.assign({ created: new Date().toISOString() }, prev || {}, pr, { tool, synced:true, updated: pr.updated || (prev && prev.updated) || new Date().toISOString() })); });
  writeProjects(list.sort((a, b) => String(b.updated).localeCompare(String(a.updated))));
}
function projectsOf(tool) { return readProjects().filter(x => x.tool === tool).sort((a, b) => String(b.updated).localeCompare(String(a.updated))); }

/* ---------- accountinstellingen (veiligheid): AI-herkenning en documenten bewaren ---------- */
const SETTINGS_KEY = "parselab-settings";
function readSettings() { const d = { ai:false, storeDocs:true, keepFiles:true }; try { Object.assign(d, JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")); } catch (e) {} return d; }
function writeSettings(st) { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(st)); } catch (e) {} document.querySelectorAll("iframe.bench-frame").forEach(f => { try { f.contentWindow.postMessage({ source:"parselab-dashboard", type:"parselab:settings", settings:st }, "*"); } catch (e) {} }); }

/* ---------- bestanden bewaren in ParseLab (IndexedDB in deze browser), instelbaar onder Account ---------- */
function filesDb() { return new Promise((res, rej) => { const r = indexedDB.open("parselab-files", 1); r.onupgradeneeded = () => r.result.createObjectStore("files", { keyPath:"id" }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function filesPut(rec) { const db = await filesDb(); return new Promise((res, rej) => { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").put(rec); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function filesAll() { try { const db = await filesDb(); return await new Promise((res, rej) => { const r = db.transaction("files", "readonly").objectStore("files").getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); } catch (e) { return []; } }
async function filesDel(id) { const db = await filesDb(); return new Promise((res, rej) => { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").delete(id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function filesClear() { try { const db = await filesDb(); await new Promise((res, rej) => { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").clear(); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) {} }
async function keepFile(d) {
  if (!readSettings().keepFiles || !d.blob) return;
  try { await filesPut({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), tool:d.tool, name:String(d.name || "bestand"), mime:d.mime || "", size:d.blob.size, rows:d.rows || null, when:new Date().toISOString(), blob:d.blob }); if (state.view === "files") loadFiles(); } catch (e) {}
}

/* ---------- serverstatus: draait de ParseLab-server (node server/server.js)? ---------- */

async function checkServer() { try { const r = await fetch(CONFIG.apiBase + "/api/scrape/status", { cache:"no-store" }); serverOk = r.ok; } catch (e) { serverOk = false; } return serverOk; }

    { key:"scrape", name:"ParseScraper", task:"Websites uitlezen", tagline:"Een lijst van een website in Excel", mark:"PS", tone:TONE.scrape,
      projectWord:"taak", projectWords:"taken", projectSection:"done",
      local:"Openbare websites leest de ParseLab-server uit; je computer mag uit staan. Ingelogde pagina's doe je met de extensie.",
      state:extState,

      bench:{ kind:"frame", src:"tools/parsescraper.html", extensionSection:"install", extPanelTitle:"Ingelogde portalen lees je uit met de extensie", intro:"Openbare websites leest ParseLab vanaf de server uit. Voor pagina's waar je moet inloggen werkt de extensie in je eigen browser; die gegevens verlaten je computer niet." },

    { key:"board", name:"ParseBoard", task:"Overzichten maken", tagline:"Cijfers en grafieken uit je bestand", mark:"PB", tone:TONE.board,
      projectWord:"overzicht", projectWords:"overzichten", projectSection:"1",
      local:"Blijft op je computer: je bestand en je overzicht worden lokaal bewaard.",
      sections:[ { id:"1", label:"Bron" }, { id:"2", label:"Typen" }, { id:"3", label:"Cijfers" }, { id:"4", label:"Onderdelen" }, { id:"5", label:"Weergave" }, { id:"6", label:"Overzicht" } ], numbered:true,
      bench:{ kind:"frame", src:"tools/parseboard.html" },
      steps:[ { title:"Kies een bron", body:"Je bestand of de voorbeeldgegevens." }, { title:"Kies je cijfers", body:"Suggesties staan klaar." }, { title:"Sla op", body:"Het overzicht blijft op je computer." } ] }

/* ===== helpers ===== */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch])); }
function pill(text, cls) { return text ? `<span class="pill ${cls}">${esc(text)}</span>` : ""; }
function tile(t, size) { return `<span class="tile tile-${size}" style="background:${t.tone.tile}">${esc(t.mark)}</span>`; }
function dot(color) { return `<span class="dot" style="background:${color}"></span>`; }
const LOCK_ICO = `<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>`;
function lock(text) { return `<span class="lock">${LOCK_ICO}<span>${esc(text)}</span></span>`; }
function greeting() { const h = new Date().getHours(); return h < 6 ? "Goedenacht" : h < 12 ? "Goedemorgen" : h < 18 ? "Goedemiddag" : "Goedenavond"; }
function when(iso) { try { return new Date(iso).toLocaleString("nl-NL", { dateStyle:"short", timeStyle:"short" }); } catch (e) { return ""; } }

/* ===== state & routing: #view/section/project ===== */
const VIEWS = ["overview", "files", "help", "form", "scrape", "pdf", "board"];
const state = { view:"overview", bench:false, section:null, project:null, toolMax:null, query:"", menu:null, modal:null, user:null };
function parseHash() {
  const [view, sub, proj] = location.hash.replace(/^#\/?/, "").split("/");
  state.view = VIEWS.includes(view) ? view : "overview";
  const tool = toolDefs().find(d => d.key === state.view) || null;
  if (tool) { const ids = tool.sections.map(x => x.id); state.section = ids.includes(sub) ? sub : ids[0]; state.bench = true; }
  else { state.bench = false; state.section = null; }
  state.project = proj ? decodeURIComponent(proj) : null;
}
function go(view, section, projectId) {
  const t = toolDefs().find(d => d.key === view);
  const sub = t ? "/" + (section && t.sections.some(s => s.id === section) ? section : t.sections[0].id) : "";
  const target = "#" + view + sub + (projectId && sub ? "/" + encodeURIComponent(projectId) : "");
  state.menu = null; state.modal = null;
  if (location.hash === target) { parseHash(); render(); } else location.hash = target;
}
window.addEventListener("hashchange", () => { const wasView = state.view; parseHash(); if (state.view !== wasView) state.toolMax = null; render(); if (state.view !== wasView) window.scrollTo({ top:0 }); });

/* ===== render ===== */
function render() {
  const root = document.getElementById("root");
  if (!state.user) { root.innerHTML = renderLogin(); bindLogin(); return; }
  if (!root.querySelector(".shell")) { root.innerHTML = renderShell(); bindShell(); }
  const defs = toolDefs(), tool = defs.find(d => d.key === state.view) || null;

  document.getElementById("nav-main").innerHTML = navItem({ label:"Overzicht", key:"overview", lead:dot("#F2F0E7") }) + navItem({ label:"Bestanden", key:"files", lead:dot("rgba(242,240,231,.5)") }) + navItem({ label:"Hulp", key:"help", lead:dot("rgba(242,240,231,.5)") });
  document.getElementById("nav-tools").innerHTML = defs.map(d => navItem({ label:d.name, key:d.key, meta:navMeta(d), lead:tile(d, 26) }) + navSub(d)).join("");
  document.getElementById("user-initials").textContent = state.user.initials;
  document.getElementById("user-name").textContent = state.user.name;
  document.getElementById("user-mail").textContent = state.user.email;
  const um = document.getElementById("user-menu"); um.innerHTML = state.menu === "user" ? renderUserMenu() : ""; um.hidden = state.menu !== "user";

  const eyebrow = document.getElementById("top-eyebrow"), title = document.getElementById("top-title"), sub = document.getElementById("top-sub"), action = document.getElementById("top-action");
  document.querySelector(".topbar-text").classList.toggle("overview-title", !tool && state.view === "overview");
  if (tool) {
    const pr = state.project && readProjects().find(x => x.id === state.project);
    eyebrow.textContent = tool.task; title.textContent = pr ? pr.name : tool.name; sub.textContent = pr ? tool.name + " · " + tool.projectWord : tool.tagline;
    action.textContent = "Nieuwe " + tool.projectWord; action.onclick = () => { state.modal = { kind:"newproject", tool:tool.key }; render(); focusLater("np-name"); };
    document.title = (pr ? pr.name + " · " : "") + tool.name + " · ParseLab";
  } else {
    const heads = { files:["Bestanden", "Wat ParseLab voor je heeft uitgelezen."], help:["Hulp", "Zo werkt elke tool, in gewone taal."] };
    const h = heads[state.view] || [greeting() + ", " + state.user.name.split(" ")[0], "Waar wil je mee verder?"];
    eyebrow.textContent = "ParseLab"; title.textContent = h[0]; sub.textContent = h[1];
    document.querySelector(".topbar-text").classList.toggle("overview-title", state.view === "overview");
    action.textContent = "Wat wil je doen?"; action.onclick = () => go("overview");
    action.hidden = state.view === "overview";
    document.title = (heads[state.view] ? h[0] + " · " : "") + "ParseLab";
  }
  action.hidden = state.view === "overview";

  const view = document.getElementById("view");
  const frame = view.querySelector("iframe.bench-frame");
  const q = state.query.trim();
  if (q) view.innerHTML = renderSearch(defs, q);
  else if (tool && frame && frame.dataset.tool === tool.key && !(tool.bench.extensionSection && state.section === tool.bench.extensionSection)) {
    sendSection(frame, state.section);
    if (state.project && frame.dataset.project !== state.project) { frame.dataset.project = state.project; sendProject(frame, state.project); }
  } else {
    view.innerHTML = tool ? renderBench(tool) : state.view === "files" ? renderFiles(defs) : state.view === "help" ? renderHelp(defs) : renderOverview(defs);
    const f = view.querySelector("iframe.bench-frame");
    if (f) f.addEventListener("load", () => initFrame(f));
    if (state.view === "files") loadFiles();
  }
  document.getElementById("modal").innerHTML = state.modal ? renderModal(state.modal, defs) : "";
  bindActions();
  document.getElementById("search").value = state.query;
}
function navMeta(t) {
  if (t.key === "scrape" && stats.scrape && stats.scrape.running) return "bezig";
  if (t.key === "pdf" && stats.pdf && stats.pdf.review) return stats.pdf.review + " nakijken";
  return "";
}
function focusLater(id) { setTimeout(() => { const i = document.getElementById(id); if (i) i.focus(); }, 50); }

function renderShell() {
  return `
  <div class="shell">
    <aside class="side" aria-label="Navigatie">
      <a class="logo" href="#overview" title="Naar overzicht"><span class="logo-mark"></span><span class="logo-word">ParseLab</span></a>
      <nav class="group"><div class="caps-nav group-label">Werkruimte</div><div id="nav-main" class="group"></div></nav>
      <nav class="group"><div class="caps-nav group-label">Software</div><div id="nav-tools" class="group"></div></nav>
      <div class="spacer"></div>
      <div class="user-wrap">
        <div class="menu" id="user-menu" hidden></div>
        <button type="button" class="user" id="user-btn"><span class="avatar" id="user-initials"></span><span class="stack" style="flex:1; min-width:0"><span class="user-name" id="user-name"></span><span class="user-mail" id="user-mail"></span></span></button>
      </div>
    </aside>
    <main class="work">
      <div class="topbar">
        <div class="topbar-text"><div class="caps-nav" id="top-eyebrow"></div><h1 id="top-title"></h1><div class="sub" id="top-sub"></div></div>
        <div class="topbar-actions"><input class="search" id="search" type="search" placeholder="Zoek een project…" aria-label="Zoeken"><button type="button" class="btn btn-navy" id="top-action"></button></div>
      </div>
      <section id="view"></section>
    </main>
  </div>
  <div id="modal"></div>`;
}
function bindShell() {
  checkServer().then(() => { if (state.view === "scrape" && serverOk === false) { const v = document.getElementById("view"); if (v) v.innerHTML = ""; } if (state.view === "scrape" || state.view === "files") render(); });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; render(); });
  document.getElementById("user-btn").onclick = () => { state.menu = state.menu === "user" ? null : "user"; render(); };
  document.addEventListener("click", e => { if (state.menu && !e.target.closest(".user-wrap")) { state.menu = null; render(); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && (state.menu || state.modal)) { state.menu = null; state.modal = null; render(); } });
  const v = document.documentElement.dataset.parselabExtension; if (v) stats.extension = { version:v };
  try { window.postMessage({ source:"parselab-dashboard", type:"parselab:ping" }, "*"); } catch (e) {}
}

/* ---------- login ---------- */
function renderLogin() {
  return `
  <div class="login">
    <div class="login-left">
      <span class="logo" style="padding:0"><span class="logo-mark"></span><span class="logo-word">ParseLab</span></span>
      <h1>Documenten, websites en formulieren, zonder klikwerk.</h1>
      <p>Log in met je e-mailadres. Je krijgt een link, geen wachtwoord om te onthouden.</p>
    </div>
    <div class="login-right">
      <form class="card login-card" id="login-form">
        <div class="title-24">Inloggen</div>
        <div class="field"><label for="login-email">E-mailadres</label><input id="login-email" type="email" required placeholder="naam@kantoor.nl" autocomplete="email"></div>
        <button type="submit" class="btn btn-navy">Stuur mij een inloglink <span class="arrow">→</span></button>
        <div class="note" id="login-note" hidden></div>
      </form>
    </div>
  </div>`;
}
function bindLogin() {
  const form = document.getElementById("login-form"), note = document.getElementById("login-note");
  form.onsubmit = e => {
    e.preventDefault(); const email = document.getElementById("login-email").value.trim(); if (!email) return;
    note.hidden = false; note.innerHTML = `Inloglink gestuurd naar <span class="strong">${esc(email)}</span>. In deze versie ben je meteen ingelogd.`;
    setTimeout(() => { state.user = userFromEmail(email); writeSession(state.user); if (!location.hash) history.replaceState(null, "", "#overview"); render(); }, 700);
  };
}

/* ---------- zijbalk ---------- */
function navItem({ label, key, meta, lead }) {
  return `<button type="button" class="nav-item" data-go="${key}" ${state.view === key ? 'aria-current="page"' : ""}>${lead}<span class="label">${esc(label)}</span>${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</button>`;
}
function navSub(t) {
  if (state.view !== t.key) return "";
  const max = state.toolMax != null ? state.toolMax : Infinity;
  const projs = projectsOf(t.key).slice(0, 8);
  return `<div class="nav-sub">${t.sections.map((s, i) => {
    const locked = t.key === "board" && (i + 1) > max;
    return `<button type="button" class="nav-sub-item" data-section="${esc(s.id)}" ${state.section === s.id ? 'aria-current="page"' : ""} ${locked ? "disabled" : ""}>${t.numbered ? `<span class="idx">${i + 1}</span>` : ""}<span>${esc(s.label)}</span></button>`;
  }).join("")}
  <div class="nav-proj-label">${esc(t.projectWords)}</div>
  ${projs.map(pr => `<button type="button" class="nav-sub-item proj" data-project="${esc(pr.id)}" ${state.project === pr.id ? 'aria-current="page"' : ""} title="${esc(pr.name)}"><span class="pdot"></span><span>${esc(pr.name)}</span></button>`).join("")}
  <button type="button" class="nav-sub-item proj new" data-new-project="${t.key}"><span>+ Nieuwe ${esc(t.projectWord)}</span></button>
  </div>`;
}
function renderUserMenu() {
  return `<button type="button" data-modal="account">Account</button><button type="button" data-modal="extension">Verbonden extensie</button><button type="button" id="logout">Uitloggen</button>`;
}

/* ---------- overzicht: kies waar je mee verder wilt, en je projecten ---------- */
function renderOverview(defs) {
  const all = readProjects().sort((a, b) => String(b.updated).localeCompare(String(a.updated)));
  const byKey = Object.fromEntries(defs.map(d => [d.key, d]));
  return `
    <div style="display:flex; flex-direction:column; gap:32px;">
      <div class="launch">
        ${defs.map(t => `<button type="button" data-bench="${t.key}">
          <span class="lh"><span class="ltile" style="background:${t.key === "form" ? "#CFDCEA" : "#E7E2CE"}">${esc(t.mark)}</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></span>
          <span class="stack"><span class="lt">${esc(t.task)}</span><span class="ls">${esc(t.tagline)}</span></span>

  if (key === "pdf") return `<span style="display:flex; gap:10px; align-items:stretch; height:100%;"><span class="doc"><i class="t"></i><i></i><i class="g"></i><i></i><i class="g2"></i><i></i></span><span class="tbl"><span class="tr2 h"><i></i><i></i><i class="k"></i></span><span class="tr2 d"><i>NL84…</i><i>€ 1.240</i><i class="k"></i></span><span class="tr2 d d2"><i>NL22…</i><i>€ 860</i><i class="k"></i></span><span class="tr2 d d3"><i></i><i></i><i class="k"></i></span></span></span>`;
  return `<span class="bars"><i style="height:38%; animation-delay:0s"></i><i style="height:62%; animation-delay:.08s"></i><i style="height:48%; animation-delay:.16s"></i><i class="g" style="height:82%; animation-delay:.24s"></i><i style="height:70%; animation-delay:.32s"></i><i style="height:96%; animation-delay:.4s"></i></span><span class="spark"><svg width="86" height="20" viewBox="0 0 86 20" fill="none" aria-hidden="true"><path d="M2 15 16 11 30 13 44 7 58 9 70 4 84 2" stroke="#8FB4DA" stroke-width="1.8" stroke-linecap="round"/></svg><span>+12,4%</span></span>`;
}
function miniVisual(key, pr) {
  const seed = String(pr.id || pr.name).split("").reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 997, 7);
  const hs = [0, 1, 2, 3, 4].map(i => 35 + ((seed * (i + 3) * 7) % 60));
  if (key === "board") { const pts = hs.map((h, i) => `${2 + i * 15} ${18 - h / 6}`).join(" L"); return `<svg width="64" height="20" viewBox="0 0 64 20" fill="none" aria-hidden="true"><path d="M${pts}" stroke="#1F3A5F" stroke-width="1.8" stroke-linecap="round"/></svg>`; }
  const max = Math.max(...hs);
  return `<span class="mini" aria-hidden="true">${hs.map(h => `<i class="${h === max ? "d" : h > 55 ? "m" : ""}" style="height:${h}%"></i>`).join("")}</span>`;
}

function initFrame(f) {

function renderFiles() {

async function loadFiles() {
  const kept = document.getElementById("files-kept");

}

/* ---------- zoeken in projecten ---------- */
function renderSearch(defs, q) {
  const lq = q.toLowerCase(), byKey = Object.fromEntries(defs.map(d => [d.key, d]));
  const hits = readProjects().filter(pr => pr.name.toLowerCase().includes(lq) && byKey[pr.tool]);
  const text = t => [t.name, t.tagline, t.desc, t.intro, (t.bench && t.bench.intro) || "", ...(t.steps || []), ...t.sections.map(x => x.label + " " + (x.hint || ""))].join(" ").toLowerCase();
  const tools = defs.filter(t => text(t).includes(lq));
  const steps = defs.flatMap(t => t.sections.filter(x => (x.label + " " + (x.hint || "")).toLowerCase().includes(lq)).map(x => ({ t, x })));
  const row = (main, sub, t, btn) => `<div class="tr proj-row"><div class="cell-main"><span>${main}</span><span class="mono-12">${sub}</span></div><div class="cell-tool">${dot(t.tone.dot)}<span>${esc(t.name)}</span></div>${btn}<span></span></div>`;
  const any = hits.length || tools.length || steps.length;
  return `<div class="card"><div class="card-head"><div class="caps">Zoekresultaten voor “${esc(q)}”</div><button type="button" class="link" id="clear-search">Wissen</button></div>
    <div class="table">${hits.map(pr => { const t = byKey[pr.tool]; return row(esc(pr.name), esc(t.projectWord), t, `<button type="button" class="btn btn-outline btn-small" data-open-project="${esc(pr.id)}" data-open-tool="${t.key}">Openen</button>`); }).join("")}
    ${steps.map(({ t, x }) => row(esc(x.label), "Stap in " + esc(t.name), t, `<button type="button" class="btn btn-outline btn-small" data-go="${t.key}" data-section="${esc(x.id)}">Ga naar stap</button>`)).join("")}
    ${tools.filter(t => !steps.some(s => s.t === t)).map(t => row(esc(t.name), esc(t.tagline || ""), t, `<button type="button" class="btn btn-outline btn-small" data-go="${t.key}">Openen</button>`)).join("")}
    ${any ? "" : `<div class="note empty">Niets gevonden. Kijk bij Hulp voor uitleg per tool.</div>`}</div></div>`;
}

/* ---------- koppeling met de tools en de extensie ---------- */
function sendSection(frame, section) { if (!frame || !section) return; try { frame.contentWindow.postMessage({ source:"parselab-dashboard", type:"parselab:nav", section }, "*"); } catch (e) {} }
function sendProject(frame, id) {
  const pr = readProjects().find(x => x.id === id) || (id.startsWith("new:") ? { id, name:id.slice(4), payload:{}, isNew:true } : null);
  if (!frame || !pr) return;
  try { frame.contentWindow.postMessage({ source:"parselab-dashboard", type:"parselab:load-project", project:pr }, "*"); } catch (e) {}
}
window.addEventListener("message", ev => {
  const d = ev.data || {};
  if (d.source === "parselab-extension" && d.type === "parselab:extension") { if (!stats.extension || stats.extension.version !== d.version) { stats.extension = { version:String(d.version || "") }; if (state.user) render(); } return; }
  if (d.source !== "parselab-tool") return;
  if (d.type === "parselab:stats" && d.tool) { stats[d.tool] = d; if (state.user) renderNavOnly(); return; }
  if (d.type === "parselab:projects" && d.tool) { syncProjects(d.tool, d.list); if (state.user) { renderNavOnly(); if (!state.bench) render(); } return; }
  if (d.type === "parselab:project" && d.tool && d.id) {
    upsertProject({ id:d.id, tool:d.tool, name:String(d.name || "Zonder naam").slice(0, 80), payload:d.payload || {}, synced:false });
    if (d.open && state.view === d.tool) { state.project = d.id; history.replaceState(null, "", "#" + d.tool + "/" + state.section + "/" + encodeURIComponent(d.id)); const f = document.querySelector("iframe.bench-frame"); if (f) f.dataset.project = d.id; }
    if (state.user) { renderNavOnly(); renderTop(); } return;
  }
  if (d.type === "parselab:open" && d.view) { go(d.view, d.section); return; }
  if (d.type === "parselab:file") { keepFile(d); return; }
  if (d.type !== "parselab:section" && d.type !== "parselab:ready") return;
  const tool = toolDefs().find(t => t.key === state.view); if (!tool) return;
  const fr = document.querySelector("iframe.bench-frame");
  if (fr && fr.contentWindow === ev.source && fr.dataset.ready !== "1") { initFrame(fr); if (d.section && String(d.section) !== state.section) sendSection(fr, state.section); }
  if (d.type === "parselab:ready") return;
  if (d.max != null) state.toolMax = d.max;
  if (d.section && tool.sections.some(s => s.id === String(d.section))) { state.section = String(d.section); history.replaceState(null, "", "#" + tool.key + "/" + state.section + (state.project ? "/" + encodeURIComponent(state.project) : "")); }
  renderNavOnly();
});
function renderNavOnly() { const el = document.getElementById("nav-tools"); if (!el) return; el.innerHTML = toolDefs().map(t => navItem({ label:t.name, key:t.key, meta:navMeta(t), lead:tile(t, 26) }) + navSub(t)).join(""); bindNav(); }
function renderTop() { const tool = toolDefs().find(d => d.key === state.view); const pr = state.project && readProjects().find(x => x.id === state.project); if (tool && pr) { document.getElementById("top-title").textContent = pr.name; document.getElementById("top-sub").textContent = tool.name + " · " + tool.projectWord; } }

function bindNav() {
  document.querySelectorAll("[data-go]").forEach(el => { el.onclick = () => go(el.getAttribute("data-go"), el.getAttribute("data-section") || undefined); });
  document.querySelectorAll(".nav-sub-item[data-section]").forEach(el => { el.onclick = () => { if (!el.disabled) go(state.view, el.getAttribute("data-section"), state.project); }; });
  document.querySelectorAll("[data-project]").forEach(el => { el.onclick = () => { const t = toolDefs().find(x => x.key === state.view); go(state.view, t.projectSection, el.getAttribute("data-project")); }; });
  document.querySelectorAll("[data-new-project]").forEach(el => { el.onclick = () => { state.modal = { kind:"newproject", tool:el.getAttribute("data-new-project") }; render(); focusLater("np-name"); }; });
}
function bindActions() {
  bindNav();
  document.querySelectorAll("[data-bench]").forEach(el => { el.onclick = () => go(el.getAttribute("data-bench")); });
  document.querySelectorAll("[data-open-project]").forEach(el => { el.onclick = () => { const t = toolDefs().find(x => x.key === el.getAttribute("data-open-tool")); go(t.key, t.projectSection, el.getAttribute("data-open-project")); }; });
  document.querySelectorAll("[data-edit-project]").forEach(el => { el.onclick = () => { state.modal = { kind:"project", id:el.getAttribute("data-edit-project") }; render(); }; });
  document.querySelectorAll("[data-modal]").forEach(el => { el.onclick = () => { state.modal = { kind:el.getAttribute("data-modal") }; state.menu = null; render(); }; });
  document.querySelectorAll("[data-close]").forEach(el => { el.onclick = () => { state.modal = null; render(); }; });
  document.querySelectorAll("[data-close-bg]").forEach(el => { el.onclick = e => { if (e.target === el) { state.modal = null; render(); } }; });
  const np = document.getElementById("np-save"); if (np) { const start = () => { const name = (document.getElementById("np-name").value || "").trim(); if (!name) return; const t = toolDefs().find(x => x.key === state.modal.tool); state.modal = null; go(t.key, t.sections[0].id, "new:" + name); }; np.onclick = start; document.getElementById("np-form").onsubmit = e => { e.preventDefault(); start(); }; }
  const eps = document.getElementById("ep-save"); if (eps) { const save = () => { const name = (document.getElementById("ep-name").value || "").trim(); if (!name) return; renameProject(state.modal.id, name); state.modal = null; render(); }; eps.onclick = save; document.getElementById("ep-form").onsubmit = e => { e.preventDefault(); save(); }; }
  const epd = document.getElementById("ep-delete"); if (epd) epd.onclick = () => { deleteProject(state.modal.id); state.modal = null; render(); };
  const it = document.getElementById("toggle-it"); if (it) it.onclick = () => { const d = document.getElementById("it-details"); d.open = true; d.scrollIntoView({ behavior:"smooth", block:"start" }); };
  const cs = document.getElementById("clear-search"); if (cs) cs.onclick = () => { state.query = ""; render(); };
  const sa = document.getElementById("set-ai"), ss = document.getElementById("set-store");
  if (sa) sa.onchange = () => { const st = readSettings(); st.ai = sa.checked; writeSettings(st); };
  if (ss) ss.onchange = () => { const st = readSettings(); st.storeDocs = ss.checked; writeSettings(st); };
  const sk = document.getElementById("set-keep"); if (sk) sk.onchange = () => { const st = readSettings(); st.keepFiles = sk.checked; writeSettings(st); if (!sk.checked) filesClear(); };
  document.querySelectorAll("[data-del-file]").forEach(el => { el.onclick = async () => { await filesDel(el.getAttribute("data-del-file")); loadFiles(); }; });
  const rs = document.getElementById("recheck-server"); if (rs) rs.onclick = async () => { await checkServer(); render(); };
  const lo = document.getElementById("logout"); if (lo) lo.onclick = () => { state.user = null; state.menu = null; state.modal = null; writeSession(null); location.hash = "#overview"; render(); };
}

state.user = readSession();
parseHash();
render();
</script>
</body>
</html>
