<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ParseLab Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231F3A5F'/%3E%3Crect x='9' y='9' width='14' height='14' rx='4' fill='%23F2F0E7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* ===== Tokens — DESIGN-parselab.md, geen nieuwe kleuren ===== */
  :root {
    color-scheme: light;
    --navy:#1F3A5F; --navy-alt:#1A3253; --ink-deep:#16293F;
    --cream:#F2F0E7; --cream-white:#FBFAF6; --white:#FFFFFF;
    --on-dark:#F2F0E7; --on-dark-muted:rgba(242,240,231,.72); --on-dark-faint:rgba(242,240,231,.58); --on-dark-label:rgba(242,240,231,.48);
    --ink:#16293F; --muted:#6B7A8C; --hairline:#E6E3D8; --fill-inactive:#D8D5C8; --dot-inactive:#B9C3CE;
    --gold:#C9A961; --gold-tint:#EDE7D5; --blue:#2C6FA8; --blue-tint:#DCE8F2;
    --chip-dark:rgba(242,240,231,.16); --track-dark:rgba(242,240,231,.18); --nav-active:rgba(242,240,231,.14);
    --shadow-light:0 18px 44px rgba(6,18,35,.10); --shadow-dark:0 24px 60px rgba(6,18,35,.28);
    --font:Poppins,-apple-system,"Segoe UI",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { font-family:var(--font); -webkit-font-smoothing:antialiased; color:var(--ink); background:var(--cream-white); font-size:16px; line-height:1.55; }
  a { color:var(--ink); text-decoration:none; }
  button { font-family:inherit; font-size:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline:2px solid var(--gold); outline-offset:3px; border-radius:14px; }
  ::selection { background:var(--blue-tint); color:var(--ink-deep); }
  [hidden] { display:none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; animation:none !important; } }

  /* ===== Type ===== */
  .caps { font-size:13px; font-weight:500; letter-spacing:.02em; text-transform:uppercase; line-height:1.2; }
  .caps-nav { font-size:13px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; }
  .num { font-size:34px; font-weight:700; line-height:1.1; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .mono { font-family:var(--mono); font-size:13px; letter-spacing:.02em; line-height:1.5; }
  .mono-12 { font-family:var(--mono); font-size:12px; letter-spacing:.02em; }
  .mono-14 { font-family:var(--mono); font-size:14px; letter-spacing:.02em; font-variant-numeric:tabular-nums; }
  .title-24 { font-size:24px; font-weight:600; line-height:1.25; letter-spacing:-.01em; text-wrap:balance; }
  .muted { color:var(--muted); }
  .body-muted { font-size:16px; line-height:1.55; color:var(--muted); text-wrap:pretty; }
  .note { font-size:15px; line-height:1.5; color:var(--muted); text-wrap:pretty; }
  .strong { font-weight:500; color:var(--ink); }

  /* ===== Shell ===== */
  .shell { display:grid; grid-template-columns:272px 1fr; min-height:100vh; }
  .side { background:var(--navy); padding:32px 20px; display:flex; flex-direction:column; gap:32px; min-height:100vh; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .logo { display:flex; align-items:center; gap:12px; padding:0 8px; border-radius:14px; }
  .logo-mark { width:26px; height:26px; border-radius:9px; background:var(--cream); display:block; flex:none; }
  .logo-word { font-size:19px; font-weight:600; letter-spacing:-.02em; color:var(--on-dark); }
  .group { display:flex; flex-direction:column; gap:6px; }
  .group-label { padding:0 8px 6px; color:var(--on-dark-label); }
  .nav-item { display:flex; align-items:center; gap:12px; width:100%; text-align:left; font-size:16px; font-weight:500; border-radius:14px; padding:12px 14px; background:transparent; color:var(--on-dark-muted); transition:background 150ms ease-out; }
  .nav-item:hover { background:rgba(242,240,231,.08); }
  .nav-item[aria-current="page"] { background:var(--nav-active); color:var(--on-dark); }
  .nav-item .label { flex:1; }
  .nav-item .meta { font-size:12px; font-weight:500; color:var(--on-dark-muted); border-radius:999px; padding:2px 9px; background:var(--chip-dark); white-space:nowrap; }
  .nav-sub { display:flex; flex-direction:column; gap:2px; padding:2px 0 6px 0; }
  .nav-sub-item { display:flex; align-items:center; gap:10px; width:100%; text-align:left; font-size:15px; font-weight:500; border-radius:14px; padding:9px 14px 9px 52px; color:var(--on-dark-muted); transition:background 150ms ease-out; }
  .nav-sub-item:hover { background:rgba(242,240,231,.08); }
  .nav-sub-item[aria-current="page"] { background:var(--nav-active); color:var(--on-dark); }
  .nav-sub-item[disabled] { color:var(--on-dark-label); cursor:default; }
  .nav-sub-item[disabled]:hover { background:transparent; }
  .nav-sub-item .idx { font-family:var(--mono); font-size:12px; letter-spacing:.02em; width:16px; flex:none; }
  .nav-proj-label { padding:10px 14px 4px 52px; color:var(--on-dark-label); font-size:12px; letter-spacing:.06em; text-transform:uppercase; font-weight:500; }
  .nav-sub-item.proj { padding-left:52px; font-weight:400; }
  .nav-sub-item.proj .pdot { width:6px; height:6px; border-radius:999px; background:var(--gold); flex:none; }
  .nav-sub-item.proj span:not(.pdot) { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-sub-item.new { color:var(--on-dark-label); }
  .launch { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:16px; }
  .launch button { display:flex; align-items:center; gap:14px; text-align:left; background:var(--navy); color:var(--on-dark); border-radius:20px; padding:20px 22px; box-shadow:var(--shadow-dark); transition:transform 150ms ease-out, filter 150ms ease-out; }
  .launch button:hover { transform:translateY(-1px); filter:brightness(1.05); }
  .launch .stack > span:first-child { font-size:18px; font-weight:600; }
  .launch .stack > span:last-child { font-size:13px; color:var(--on-dark-muted); }
  .launch .arrow { margin-left:auto; font-weight:600; }
  .proj-row { display:grid; grid-template-columns:1.6fr 1fr auto auto; gap:12px; align-items:center; padding:12px 0; border-top:1px solid var(--hairline); }
  .tool-card .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .tool-card .proj-mini { display:flex; flex-direction:column; gap:4px; }
  .tool-card .proj-mini button { text-align:left; font-size:15px; color:var(--ink); display:flex; gap:8px; align-items:center; padding:4px 0; }
  .tool-card .proj-mini button:hover { color:var(--blue); }
  .tool-card .proj-mini .pdot { width:6px; height:6px; border-radius:999px; background:var(--gold); flex:none; }
  .dot { width:8px; height:8px; border-radius:999px; display:block; flex:none; }
  .tile { border-radius:9px; color:var(--ink-deep); font-family:var(--mono); display:flex; align-items:center; justify-content:center; flex:none; }
  .tile-26 { width:26px; height:26px; font-size:11px; }
  .tile-36 { width:36px; height:36px; border-radius:14px; font-size:13px; }
  .tile-52 { width:52px; height:52px; border-radius:14px; font-size:16px; }
  .spacer { flex:1; }
  .usage { background:var(--navy-alt); border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .usage .caps { color:var(--on-dark-muted); }
  .usage .num { color:var(--on-dark); }
  .usage .note { color:var(--on-dark-muted); font-size:14px; }
  .track { height:8px; border-radius:999px; background:var(--track-dark); overflow:hidden; }
  .track > i { display:block; height:100%; background:var(--cream); border-radius:999px; transition:width 700ms ease-out; }
  .usage .btn { align-self:flex-start; padding:11px 16px; font-size:15px; }
  .user-wrap { position:relative; }
  .user { display:flex; align-items:center; gap:12px; padding:8px; width:100%; text-align:left; border-radius:14px; transition:background 150ms ease-out; }
  .user:hover { background:rgba(242,240,231,.08); }
  .avatar { width:36px; height:36px; border-radius:999px; background:var(--gold); color:var(--ink-deep); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; flex:none; }
  .user-name { font-size:15px; font-weight:500; color:var(--on-dark); }
  .user-role { font-size:13px; color:var(--on-dark-muted); }
  .menu { position:absolute; left:8px; right:8px; bottom:calc(100% + 8px); background:var(--white); border-radius:14px; box-shadow:var(--shadow-dark); padding:8px; display:flex; flex-direction:column; gap:2px; z-index:20; }
  .menu button, .menu a { display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 12px; border-radius:9px; font-size:15px; font-weight:500; color:var(--ink); }
  .menu button:hover, .menu a:hover { background:var(--cream); }
  .menu .sep { height:1px; background:var(--hairline); margin:4px 0; }
  .menu .note { padding:4px 12px 8px; font-size:13px; }

  .work { padding:32px 48px 64px; display:flex; flex-direction:column; gap:32px; max-width:1240px; width:100%; min-width:0; }
  .topbar { display:flex; align-items:center; gap:24px; flex-wrap:wrap; position:relative; }
  .topbar-text { display:flex; flex-direction:column; gap:6px; flex:1; min-width:240px; }
  .topbar-text .caps-nav { color:var(--muted); }
  .topbar-text h1 { font-size:34px; font-weight:700; letter-spacing:-.01em; line-height:1.1; text-wrap:balance; }
  .topbar-text .sub { font-size:16px; color:var(--muted); }
  .topbar-actions { display:flex; align-items:center; gap:12px; position:relative; }
  .search { background:var(--white); border-radius:14px; padding:13px 18px; font-size:15px; color:var(--ink); box-shadow:var(--shadow-light); min-width:280px; border:0; font-family:inherit; }
  .search::placeholder { color:var(--muted); }
  .action-menu { position:absolute; right:0; top:calc(100% + 8px); background:var(--white); border-radius:20px; box-shadow:var(--shadow-dark); padding:12px; display:flex; flex-direction:column; gap:4px; z-index:20; width:340px; }
  .action-menu .caps { padding:8px 12px 4px; color:var(--muted); }
  .action-menu button { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px; border-radius:14px; transition:background 150ms ease-out; }
  .action-menu button:hover { background:var(--cream); }
  .action-menu .stack > span:first-child { font-size:16px; font-weight:500; }
  .action-menu .stack > span:last-child { font-size:13px; color:var(--muted); }

  /* ===== Buttons ===== */
  .btn { display:inline-flex; align-items:center; gap:12px; font-size:16px; font-weight:600; line-height:1; border-radius:14px; padding:15px 24px; transition:transform 150ms ease-out, filter 150ms ease-out; white-space:nowrap; }
  .btn:hover { transform:translateY(-1px); filter:brightness(1.03); }
  .btn .arrow { transition:transform 150ms ease-out; }
  .btn:hover .arrow { transform:translateX(4px); }
  .btn-navy { background:var(--navy); color:var(--on-dark); }
  .btn-cream { background:var(--cream); color:var(--ink-deep); }
  .btn-outline { background:var(--white); color:var(--navy); border:1px solid var(--navy); padding:14px 20px; }
  .btn-small { padding:10px 16px; font-size:15px; }
  .link { font-size:15px; font-weight:600; color:var(--blue); }
  .link:hover { color:var(--blue); filter:brightness(.9); }

  /* ===== Cards ===== */
  .card { background:var(--white); border-radius:20px; padding:28px; box-shadow:var(--shadow-light); display:flex; flex-direction:column; gap:16px; min-width:0; }
  .card-navy { background:var(--navy); color:var(--on-dark); border-radius:20px; padding:28px; box-shadow:var(--shadow-light); display:flex; flex-direction:column; gap:14px; }
  .card-navy .caps { color:var(--on-dark-muted); }
  .card-navy .note { color:var(--on-dark-muted); }
  .card-head { display:flex; align-items:center; gap:12px; }
  .card-head .caps { flex:1; color:var(--muted); }
  .hairline { height:1px; background:var(--hairline); }
  .card-btn { text-align:left; transition:filter 150ms ease-out; color:var(--ink); }
  .card-btn:hover { filter:brightness(1.01); }
  .stack { display:flex; flex-direction:column; gap:2px; }
  .lock { display:inline-flex; align-items:center; gap:8px; font-size:14px; }
  .lock .ico { width:16px; height:16px; flex:none; }

  .pill { display:inline-flex; align-items:center; border-radius:999px; padding:4px 12px; font-size:13px; font-weight:500; line-height:1.4; white-space:nowrap; }
  .pill-live { background:var(--blue-tint); color:var(--blue); }
  .pill-neutral { background:var(--cream); color:var(--ink-deep); }
  .pill-delta { background:var(--blue-tint); color:var(--blue); font-weight:600; }
  .pill-dark { background:var(--chip-dark); color:var(--on-dark); padding:6px 14px; }

  /* ===== Overzicht ===== */
  .tools-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:24px; }
  .tool-card { gap:14px; }
  .tool-card .card-head { flex-wrap:wrap; row-gap:10px; }
  .tool-card .card-head .caps { color:var(--muted); white-space:nowrap; }
  .tool-card .card-head .pill { flex:none; flex-basis:100%; width:max-content; }
  .tool-card .task { font-size:24px; font-weight:600; line-height:1.25; letter-spacing:-.01em; }
  .tool-card .foot { display:flex; align-items:flex-end; gap:16px; }
  .tool-card .foot .stack { flex:1; }
  .tool-card .foot .caps { color:var(--muted); }
  .tool-card .open { font-size:16px; font-weight:600; white-space:nowrap; }
  .row-2 { display:grid; grid-template-columns:1.5fr 1fr; gap:24px; align-items:start; }
  .stack-24 { display:flex; flex-direction:column; gap:24px; }

  .table { display:flex; flex-direction:column; }
  .thead, .tr { display:grid; align-items:center; gap:12px; }
  .thead { font-family:var(--mono); font-size:12px; letter-spacing:.02em; color:var(--muted); padding-bottom:4px; }
  .tr { padding:12px 0; border-top:1px solid var(--hairline); width:100%; text-align:left; color:var(--ink); }
  button.tr { border-radius:0; transition:background 150ms ease-out; }
  button.tr:hover { background:var(--cream-white); }
  .cols-runs { grid-template-columns:1.6fr 1fr .8fr .9fr; }
  .cols-list { grid-template-columns:1.7fr .9fr .7fr .7fr; }
  .cols-files { grid-template-columns:1.8fr 1fr .8fr auto; }
  .cell-main { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .cell-main > span:first-child { font-size:16px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cell-main .mono-12 { color:var(--muted); }
  .cell-tool { display:flex; align-items:center; gap:8px; font-size:15px; color:var(--muted); }
  .cell-text { font-size:15px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cell-status { display:flex; flex-direction:column; gap:3px; align-items:flex-start; }
  .cell-status .mono-12 { color:var(--muted); }

  .bars { display:flex; align-items:flex-end; gap:8px; height:88px; }
  .bar-col { flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; gap:6px; align-items:center; }
  .bar { width:100%; border-radius:8px 8px 4px 4px; flex:none; background:rgba(242,240,231,.35); transition:height 700ms ease-out; }
  .bar.on { background:var(--cream); }
  .bar-label { font-size:13px; font-weight:500; letter-spacing:.02em; color:var(--on-dark-muted); }

  .alert { display:flex; gap:12px; align-items:flex-start; }
  .alert .dot { margin-top:8px; }
  .alert .stack { flex:1; }
  .alert .stack > span:first-child { font-size:16px; font-weight:500; }
  .alert .btn { margin-top:8px; align-self:flex-start; }

  /* ===== Tool-detail ===== */
  .tool-header { background:var(--navy); color:var(--on-dark); border-radius:20px; padding:32px; box-shadow:var(--shadow-dark); display:flex; align-items:center; gap:32px; flex-wrap:wrap; }
  .tool-header .text { flex:1; min-width:260px; display:flex; flex-direction:column; gap:6px; }
  .tool-header .title-24 { color:var(--on-dark); }
  .tool-header .body-muted { color:var(--on-dark-muted); max-width:56ch; }
  .tool-header .state { display:flex; flex-direction:column; gap:4px; margin-top:8px; }
  .tool-header .lock { color:var(--on-dark-muted); }
  .tool-header .lock.on { color:var(--on-dark); }
  .tool-header .actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .kpis { display:grid; grid-template-columns:repeat(3, 1fr); gap:24px; }
  .kpi { gap:10px; }
  .kpi .note { font-size:15px; }
  .kpi .btn { align-self:flex-start; margin-top:4px; }

  .steps { display:flex; flex-direction:column; gap:16px; }
  .step { display:flex; gap:14px; align-items:flex-start; }
  .step-n { width:28px; height:28px; border-radius:9px; background:var(--cream); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; flex:none; }
  .step .stack { flex:1; }
  .step .stack > span:first-child { font-size:16px; font-weight:500; }

  /* ===== Werkbank ===== */
  .bench { padding:0; overflow:hidden; gap:0; }
  .bench-head { display:flex; align-items:center; gap:12px; padding:20px 28px; border-bottom:1px solid var(--hairline); flex-wrap:wrap; }
  .bench-head .caps { flex:1; color:var(--muted); }
  .bench-frame { width:100%; height:calc(100vh - 150px); min-height:720px; border:0; display:block; background:var(--cream-white); }
  .bench-body { padding:28px; display:grid; grid-template-columns:1.2fr 1fr; gap:32px; align-items:start; }
  .bench-actions { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .bench-note { background:var(--cream); border-radius:14px; padding:16px 20px; display:flex; flex-direction:column; gap:8px; }
  .bench-note .mono { color:var(--ink-deep); word-break:break-all; }
  .bench-side { display:flex; flex-direction:column; gap:24px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; align-items:baseline; }
  .kv .caps { color:var(--muted); }
  details.it { border-top:1px solid var(--hairline); padding-top:16px; }
  details.it summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; color:var(--muted); }
  details.it summary::-webkit-details-marker { display:none; }
  details.it summary::after { content:"+"; font-family:var(--mono); margin-left:auto; }
  details.it[open] summary::after { content:"−"; }
  details.it > div { display:flex; flex-direction:column; gap:16px; padding-top:16px; }

  /* ===== Hulp & Bestanden ===== */
  .help-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:24px; }
  .help-card ol { padding-left:20px; display:flex; flex-direction:column; gap:8px; font-size:15px; color:var(--muted); }
  .help-card li span { color:var(--ink); font-weight:500; }

  /* ===== Modal ===== */
  .modal-bg { position:fixed; inset:0; background:rgba(6,18,35,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; }
  .modal { background:var(--white); border-radius:20px; padding:28px; box-shadow:var(--shadow-dark); width:min(640px, 100%); display:flex; flex-direction:column; gap:16px; max-height:90vh; overflow:auto; }
  .modal .foot { display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end; }

  /* ===== Login ===== */
  .login { min-height:100vh; display:grid; grid-template-columns:1fr 1fr; }
  .login-left { background:var(--navy); color:var(--on-dark); padding:64px; display:flex; flex-direction:column; gap:32px; justify-content:center; }
  .login-left h1 { font-size:48px; font-weight:700; line-height:1.1; letter-spacing:-.02em; max-width:16ch; text-wrap:balance; }
  .login-left p { font-size:19px; color:var(--on-dark-muted); max-width:46ch; }
  .login-right { display:flex; align-items:center; justify-content:center; padding:48px; }
  .login-card { width:min(440px, 100%); gap:20px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-size:13px; font-weight:500; letter-spacing:.02em; text-transform:uppercase; color:var(--muted); }
  .field input { border:1px solid var(--hairline); border-radius:14px; padding:13px 16px; font-size:16px; font-family:inherit; color:var(--ink); background:var(--white); }
  .field input:focus { outline:0; border-color:var(--blue); background:var(--blue-tint); }
  .login .btn { justify-content:center; }
  .login .or { text-align:center; font-size:13px; color:var(--muted); }

  /* ===== Responsive ===== */

const SESSION_KEY = "parselab-session";
function readSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (e) { return null; } }
function writeSession(s) { try { if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); } catch (e) {} }
function userFromEmail(email) {
  const local = String(email).split("@")[0].replace(/[._-]+/g, " ").trim();
  const particles = ["de", "van", "der", "den", "het", "te", "ten", "ter", "op", "in", "'t"];
  const name = local ? local.split(" ").map((w, i) => (i > 0 && particles.includes(w.toLowerCase())) ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1)).join(" ") : "Gebruiker";
  const initials = name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
  return { email, name, initials, role:"Administratie" };

/* ---------- Projecten: bewaarde eenheden van werk per tool (taak, sjabloon, overzicht). Tools melden ze via postMessage; het dashboard bewaart de lijst. ---------- */
const PROJECTS_KEY = "parselab-projects";
function readProjects() { try { return JSON.parse(localStorage.getItem(PROJECTS_KEY) || "[]"); } catch (e) { return []; } }
function writeProjects(list) { try { localStorage.setItem(PROJECTS_KEY, JSON.stringify(list.slice(0, 200))); } catch (e) {} }
function upsertProject(pr) {
  const list = readProjects(); const i = list.findIndex(x => x.id === pr.id);
  const cur = Object.assign({ created: new Date().toISOString() }, i >= 0 ? list[i] : {}, pr, { updated: pr.updated || new Date().toISOString() });
  if (i >= 0) list[i] = cur; else list.unshift(cur);
  writeProjects(list); return cur;
}
function deleteProject(id) { writeProjects(readProjects().filter(x => x.id !== id)); }
function syncProjects(tool, incoming) {
  const ids = new Set((incoming || []).map(x => x.id));
  const list = readProjects().filter(x => !(x.tool === tool && x.synced) && !ids.has(x.id));
  (incoming || []).forEach(pr => { const prev = readProjects().find(x => x.id === pr.id); list.push(Object.assign({ created: new Date().toISOString() }, prev || {}, pr, { tool, synced:true, updated: pr.updated || (prev && prev.updated) || new Date().toISOString() })); });
  writeProjects(list.sort((a, b) => String(b.updated).localeCompare(String(a.updated))));
}
function projectsOf(tool) { return readProjects().filter(x => x.tool === tool).sort((a, b) => String(b.updated).localeCompare(String(a.updated))); }
function projectSection(t, pr) { return (t.bench && t.bench.projectSection) || t.sections[0].id; }

    if (list && list.length) {
      out.pdfTemplates = list.length;
      out.pdfRows = list.slice(0, 6).map(tpl => {

  if (stats.board) { out.boardSaved = !!stats.board.saved; out.boardFile = stats.board.fileName || null; out.boardColumns = stats.board.columns; out.boardTiles = stats.board.tiles; }
  else try {

      out.boardTiles = (k + g) || null;

  } catch (e) {}
  return out;
}

/* ===== Helpers ===== */
function nl(n) { return Number(n).toLocaleString("nl-NL"); }
function pct() { return Math.min(100, Math.round(WORKSPACE.used / WORKSPACE.limit * 100)); }

function pill(text, cls) { return text ? `<span class="pill ${cls}">${esc(text)}</span>` : ""; }
function tile(tool, size) { return `<span class="tile tile-${size}" style="background:${tool.tone.tile}">${esc(tool.mark)}</span>`; }
function dot(color) { return `<span class="dot" style="background:${color}"></span>`; }
const LOCK_ICO = `<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>`;
function lock(text, on) { return `<span class="lock ${on ? "on" : ""}">${LOCK_ICO}<span>${esc(text)}</span></span>`; }
function greeting() { const h = new Date().getHours(); return h < 6 ? "Goedenacht" : h < 12 ? "Goedemorgen" : h < 18 ? "Goedemiddag" : "Goedenavond"; }

/* ===== State & routing ===== */
const VIEWS = ["overview", "files", "help", "form", "scrape", "pdf", "board"];
const state = { view:"overview", bench:false, section:null, project:null, toolMax:null, query:"", menu:null, modal:null, user:null };

function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  const [view, sub, proj] = h.split("/");
  state.view = VIEWS.includes(view) ? view : "overview";
  const tool = toolDefs().find(d => d.key === state.view) || null;
  state.bench = !!(tool && sub);
  if (state.bench) { const ids = tool.sections.map(x => x.id); state.section = ids.includes(sub) ? sub : ids[0]; }
  else state.section = null;
  state.project = proj ? decodeURIComponent(proj) : null;
}
/* go(view) = detail; go(view, true) = werkbank op de eerste sectie; go(view, "check") = werkbank op die sectie. */
function go(view, bench, projectId) {
  let sub = "";
  if (bench === true) { const t = toolDefs().find(d => d.key === view); sub = t ? "/" + t.sections[0].id : ""; }
  else if (typeof bench === "string") sub = "/" + bench;
  const target = "#" + view + sub + (projectId && sub ? "/" + encodeURIComponent(projectId) : "");
  state.menu = null; state.modal = null;
  if (location.hash === target) { parseHash(); render(); } else location.hash = target;
}
window.addEventListener("hashchange", () => {
  const wasBench = state.bench, wasView = state.view;
  parseHash();
  if (state.view !== wasView) state.toolMax = null;
  render();
  if (!(wasBench && state.bench && state.view === wasView)) window.scrollTo({ top:0, behavior:"smooth" });
});

/* ===== Render ===== */
function render() {
  const root = document.getElementById("root");
  if (!state.user) { root.innerHTML = renderLogin(); bindLogin(); return; }
  if (!root.querySelector(".shell")) { root.innerHTML = renderShell(); bindShell(); }

  const defs = toolDefs();
  const tool = defs.find(d => d.key === state.view) || null;

  document.getElementById("nav-main").innerHTML =
    navItem({ label:"Overzicht", key:"overview", meta:"", lead:dot("#F2F0E7") }) +
    navItem({ label:"Bestanden", key:"files", meta:"", lead:dot("rgba(242,240,231,.5)") }) +
    navItem({ label:"Hulp", key:"help", meta:"", lead:dot("rgba(242,240,231,.5)") });
  document.getElementById("nav-tools").innerHTML = defs.map(d => navItem({ label:d.name, key:d.key, meta:d.navMeta, lead:tile(d, 26) }) + navSub(d)).join("");

  const p = pct();
  document.getElementById("usage").innerHTML = `
    <div class="caps">Verbruik · ${esc(WORKSPACE.plan)}</div>
    <div class="num">${nl(WORKSPACE.used)}</div>
    <div class="track"><i style="width:${p}%"></i></div>
    <div class="note">van ${nl(WORKSPACE.limit)} handelingen deze maand</div>
    ${p >= 80 ? `<div class="note" style="color:var(--on-dark)">Bijna vol. Vanaf ${esc(WORKSPACE.reset)} begin je opnieuw.</div><button type="button" class="btn btn-cream" data-go="upgrade">Meer ruimte</button>` : ""}`;
  document.getElementById("user-initials").textContent = state.user.initials;
  document.getElementById("user-name").textContent = state.user.name;
  document.getElementById("user-role").textContent = state.user.role;
  const um = document.getElementById("user-menu");
  um.innerHTML = state.menu === "user" ? renderUserMenu() : ""; um.hidden = state.menu !== "user";

  const eyebrow = document.getElementById("top-eyebrow"), title = document.getElementById("top-title"), sub = document.getElementById("top-sub"), action = document.getElementById("top-action"), ext = document.getElementById("top-ext");
  ext.hidden = true;
  if (tool) {
    eyebrow.textContent = tool.task; title.textContent = tool.name; sub.textContent = tool.tagline;
    action.textContent = state.bench ? "Terug naar " + tool.name : tool.bench.benchLabel;
    action.onclick = () => go(tool.key, !state.bench);
    if (state.bench && tool.bench.kind === "frame") { ext.hidden = false; ext.href = tool.bench.src; }
    document.title = tool.name + " · ParseLab";
  } else {
    const heads = { files:["Bestanden", "Alles wat je hebt gedownload, van alle software, op datum."], help:["Hulp", "Zo werkt elke tool, in gewone taal."] };
    const h = heads[state.view] || [greeting() + ", " + state.user.name.split(" ")[0], ""];
    eyebrow.textContent = "Werkruimte · " + WORKSPACE.org; title.textContent = h[0]; sub.textContent = h[1];
    action.textContent = "Wat wil je doen?"; action.onclick = toggleActionMenu;
    document.title = (heads[state.view] ? h[0] + " · " : "") + "ParseLab Dashboard";
  }
  const am = document.getElementById("action-menu");
  am.innerHTML = state.menu === "action" ? renderActionMenu(defs) : ""; am.hidden = state.menu !== "action";

  const view = document.getElementById("view");
  const frame = view.querySelector("iframe.bench-frame");
  const q = state.query.trim();
  if (q) {
    view.innerHTML = renderSearch(defs, q);
  } else if (tool && state.bench && frame && frame.dataset.tool === tool.key && !(tool.bench.extensionSection && state.section === tool.bench.extensionSection)) {
    sendSection(frame, state.section);
    if (state.project && frame.dataset.project !== state.project) { frame.dataset.project = state.project; sendProject(frame, state.project); }
  } else {
    view.innerHTML = tool ? (state.bench ? renderBench(tool) : renderTool(tool)) : state.view === "files" ? renderFiles(defs) : state.view === "help" ? renderHelp(defs) : renderOverview(defs);
    const f = view.querySelector("iframe.bench-frame");
    if (f) f.addEventListener("load", () => { if (f.dataset.ready === "1") return; f.dataset.ready = "1"; sendSection(f, state.section); try { f.contentWindow.postMessage({ source:"parselab-dashboard", type:"parselab:lang", lang:CONFIG.lang }, "*"); } catch (e) {} if (state.project) { f.dataset.project = state.project; sendProject(f, state.project); } });
  }
  document.getElementById("modal").innerHTML = state.modal ? renderModal(state.modal, defs) : "";
  bindActions();
  document.getElementById("search").value = state.query;
}

      <nav class="group" aria-label="Werkruimte"><div class="caps-nav group-label">Werkruimte</div><div id="nav-main" class="group"></div></nav>
      <nav class="group" aria-label="Software"><div class="caps-nav group-label">Software</div><div id="nav-tools" class="group"></div></nav>

      <div class="user-wrap">

          <a class="link" id="top-ext" target="_blank" rel="noopener" hidden>In nieuw tabblad openen →</a>

function bindShell() {
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; render(); });
  document.getElementById("user-btn").onclick = () => { state.menu = state.menu === "user" ? null : "user"; render(); };
  document.addEventListener("click", e => { if (state.menu && !e.target.closest(".user-wrap, .topbar-actions")) { state.menu = null; render(); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && (state.menu || state.modal)) { state.menu = null; state.modal = null; render(); } });
  askExtension();
}
function toggleActionMenu() { state.menu = state.menu === "action" ? null : "action"; render(); }

        <div class="title-24">Inloggen</div>
        <div class="field"><label for="login-email">E-mailadres</label><input id="login-email" type="email" required placeholder="naam@kantoor.nl" autocomplete="email"></div>
        <button type="submit" class="btn btn-navy">Stuur mij een inloglink <span class="arrow">→</span></button>
        <div class="note" id="login-note" hidden></div>

        <button type="button" class="btn btn-outline" data-sso="Google">Inloggen met Google</button>

      </form>

}
function bindLogin() {
  const form = document.getElementById("login-form"), note = document.getElementById("login-note");
  form.onsubmit = e => {
    e.preventDefault();
    const email = document.getElementById("login-email").value.trim();
    if (!email) return;
    /* Zonder backend wordt de link niet echt gestuurd; de sessie start direct op deze computer. */
    note.hidden = false; note.innerHTML = `We hebben een inloglink gestuurd naar <span class="strong">${esc(email)}</span>. In deze proefversie ben je meteen ingelogd.`;
    setTimeout(() => { state.user = userFromEmail(email); writeSession(state.user); render(); }, 900);
  };
  form.querySelectorAll("[data-sso]").forEach(b => { b.onclick = () => { note.hidden = false; note.textContent = "Inloggen met " + b.getAttribute("data-sso") + " is nog niet gekoppeld in deze versie. Gebruik je e-mailadres."; }; });
}

/* ---------- Zijbalk ---------- */
function navItem({ label, key, meta, lead }) {
  const on = state.view === key;
  return `<button type="button" class="nav-item" data-go="${key}" ${on ? 'aria-current="page"' : ""}>${lead}<span class="label">${esc(label)}</span>${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</button>`;
}
function navSub(t) {
  if (state.view !== t.key) return "";
  const max = state.toolMax != null ? state.toolMax : Infinity;
  const projs = projectsOf(t.key).slice(0, 8);
  return `<div class="nav-sub">${t.sections.map((s, i) => {
    const on = state.bench && state.section === s.id;
    const locked = t.key === "board" && (i + 1) > max;
    return `<button type="button" class="nav-sub-item" data-section="${esc(s.id)}" ${on ? 'aria-current="page"' : ""} ${locked ? "disabled" : ""}>${t.numbered ? `<span class="idx">${i + 1}</span>` : ""}<span>${esc(s.label)}</span></button>`;
  }).join("")}
  <div class="nav-proj-label">${esc(t.projectWords || "projecten")}</div>
  ${projs.map(pr => `<button type="button" class="nav-sub-item proj" data-project="${esc(pr.id)}" ${state.project === pr.id ? 'aria-current="page"' : ""} title="${esc(pr.name)}"><span class="pdot"></span><span>${esc(pr.name)}</span></button>`).join("")}
  <button type="button" class="nav-sub-item proj new" data-new-project="${t.key}"><span>+ Nieuwe ${esc(t.projectWord || "project")}</span></button>
  </div>`;
}
function renderUserMenu() {
  return `
    <div class="note"><span class="strong">${esc(state.user.name)}</span><br>${esc(state.user.email)}</div>
    <button type="button" data-modal="account">Account</button>

    <div class="sep"></div>

    <button type="button" data-modal="extension">Verbonden extensie</button>

function renderActionMenu(defs) {

          <div class="table">
            <div class="thead cols-runs"><div>taak</div><div>software</div><div>regels</div><div>status</div></div>

            ${ov.alerts.map(a => `<div class="alert">${dot(a.dot)}<div class="stack"><span>${esc(a.title)}</span><span class="note">${esc(a.body)}</span>${actionBtn(a.action, "btn btn-outline btn-small")}</div></div>`).join("")}

function runRow(r) {
  return `
    <button type="button" class="tr cols-runs" data-run="${r.id}" title="${esc(r.status === "klaar" ? "Bestand downloaden" : r.errors ? "Fouten bekijken" : "Voortgang bekijken")}">
      <div class="cell-main"><span>${esc(r.name)}</span><span class="mono-12">${esc(r.when)}</span></div>
      <div class="cell-tool">${dot(r.tool.tone.dot)}<span>${esc(r.tool.name)}</span></div>
      <div class="mono-14">${esc(r.rows)}</div>
      <div class="cell-status">${pill(r.status, r.cls)}${r.progress ? `<span class="mono-12">${esc(r.progress)}</span>` : ""}</div>
    </button>`;
}
function actionBtn(a, cls) {
  if (!a) return "";
  if (a.run) return `<button type="button" class="${cls}" data-run="${esc(a.run)}">${esc(a.label)}</button>`;
  if (a.view === "upgrade") return `<button type="button" class="${cls}" data-go="upgrade">${esc(a.label)}</button>`;
  if (a.view) return `<button type="button" class="${cls}" data-bench="${esc(a.view)}" data-bench-section="${esc(a.section || "")}">${esc(a.label)}</button>`;
  return "";
}

/* ---------- Werkbank ---------- */
function renderBench(t) {
  let b = t.bench;
  const extPanel = b.kind === "extension" || (b.extensionSection && state.section === b.extensionSection);
  if (!extPanel) {
    return `<div class="card bench"><iframe class="bench-frame" data-tool="${t.key}" src="${esc(b.src)}?embed=1&section=${esc(state.section || "")}" title="${esc(t.name)}" loading="eager" sandbox="allow-same-origin allow-scripts allow-forms allow-downloads allow-popups allow-modals"></iframe></div>`;
  }
  b = Object.assign({}, b, { panelTitle: b.extPanelTitle || b.panelTitle });
  const store = CONFIG.webstoreUrl, ext = stats.extension;
  return `
    <div class="card bench">

/* ---------- Zoeken over alle software ---------- */
function renderSearch(defs, q) {
  const lq = q.toLowerCase();
  const hits = [];
  defs.forEach(t => t.rows.forEach(r => { if ((r.a + " " + r.b + " " + r.sub).toLowerCase().includes(lq)) hits.push({ kind:t.unit, name:r.a, sub:r.sub, tool:t, section:r.section }); }));
  overviewData(defs).runs.forEach(r => { if ((r.name + " " + (r.file || "")).toLowerCase().includes(lq)) hits.push({ kind:"ronde", name:r.name, sub:r.when + (r.file ? " · " + r.file : ""), tool:r.tool, run:r.id }); });
  return `
    <div class="card">

}

/* ---------- Koppelingen met de ingebedde tools en de extensie ---------- */
function sendProject(frame, id) {
  const pr = readProjects().find(x => x.id === id) || (id.startsWith("new:") ? { id, name: id.slice(4), payload:{}, isNew:true } : null);
  if (!frame || !pr) return;
  try { frame.contentWindow.postMessage({ source:"parselab-dashboard", type:"parselab:load-project", project: pr }, "*"); } catch (e) {}
}
function sendSection(frame, section) { if (!frame || !section) return; try { frame.contentWindow.postMessage({ source:"parselab-dashboard", type:"parselab:nav", section }, "*"); } catch (e) {} }
function askExtension() {
  const v = document.documentElement.dataset.parselabExtension;
  if (v) stats.extension = { version:v };
  try { window.postMessage({ source:"parselab-dashboard", type:"parselab:ping" }, "*"); } catch (e) {}
}
window.addEventListener("message", ev => {
  const d = ev.data || {};
  if (d.source === "parselab-extension" && d.type === "parselab:extension") {
    if (!stats.extension || stats.extension.version !== d.version) { stats.extension = { version:String(d.version || "") }; if (state.user) render(); }
    return;
  }
  if (d.source !== "parselab-tool") return;
  if (d.type === "parselab:stats" && d.tool) { stats[d.tool] = d; if (state.user) { renderNavOnly(); if (!state.bench) render(); } return; }
  if (d.type === "parselab:projects" && d.tool) { syncProjects(d.tool, d.list); if (state.user) { renderNavOnly(); if (!state.bench) render(); } return; }
  if (d.type === "parselab:project" && d.tool && d.id) {
    upsertProject({ id:d.id, tool:d.tool, name:String(d.name || "Zonder naam").slice(0, 80), payload:d.payload || {}, synced:false });
    if (d.open && state.view === d.tool && state.bench) { state.project = d.id; history.replaceState(null, "", "#" + d.tool + "/" + state.section + "/" + encodeURIComponent(d.id)); const f = document.querySelector("iframe.bench-frame"); if (f) f.dataset.project = d.id; }
    if (state.user) renderNavOnly(); return;
  }
  if (d.type === "parselab:open" && d.view) { go(d.view, d.section || true); return; }
  if (d.type !== "parselab:section" && d.type !== "parselab:ready") return;
  const tool = toolDefs().find(t => t.key === state.view);
  if (!tool || !state.bench) return;
  /* Eerste levensteken van de tool: sectie, taal en project sturen (niet wachten op het load-event, dat kan hangen op fonts). */
  const fr = document.querySelector("iframe.bench-frame");
  if (fr && fr.contentWindow === ev.source && fr.dataset.ready !== "1") {
    fr.dataset.ready = "1";
    if (state.section && String(d.section) !== state.section) sendSection(fr, state.section);
    try { fr.contentWindow.postMessage({ source:"parselab-dashboard", type:"parselab:lang", lang:CONFIG.lang }, "*"); } catch (e) {}
    if (state.project && fr.dataset.project !== state.project) { fr.dataset.project = state.project; sendProject(fr, state.project); }
  }
  if (d.type === "parselab:ready") return;
  if (d.max != null) state.toolMax = d.max;
  if (d.section && tool.sections.some(s => s.id === String(d.section))) {
    state.section = String(d.section);
    history.replaceState(null, "", "#" + tool.key + "/" + state.section + (state.project ? "/" + encodeURIComponent(state.project) : ""));
  }
  renderNavOnly();
});
function renderNavOnly() {
  const el = document.getElementById("nav-tools"); if (!el) return;
  el.innerHTML = toolDefs().map(t => navItem({ label:t.name, key:t.key, meta:t.navMeta, lead:tile(t, 26) }) + navSub(t)).join("");
  bindNav();
}
window.addEventListener("storage", () => { if (state.user && !state.bench) render(); });

function bindNav() {
  document.querySelectorAll("[data-go]").forEach(el => { el.onclick = () => { const v = el.getAttribute("data-go"); if (v === "upgrade") { state.modal = { kind:"upgrade" }; state.menu = null; render(); } else go(v, false); }; });
  document.querySelectorAll(".nav-sub-item[data-section]").forEach(el => { el.onclick = () => { if (!el.disabled) go(state.view, el.getAttribute("data-section")); }; });
  document.querySelectorAll(".nav-sub-item[data-project]").forEach(el => { el.onclick = () => { const t = toolDefs().find(x => x.key === state.view); go(state.view, projectSection(t), el.getAttribute("data-project")); }; });
  document.querySelectorAll(".nav-sub-item[data-new-project]").forEach(el => { el.onclick = () => { state.modal = { kind:"newproject", tool:el.getAttribute("data-new-project") }; render(); setTimeout(() => { const i = document.getElementById("np-name"); if (i) i.focus(); }, 50); }; });
}
function bindActions() {
  bindNav();
  document.querySelectorAll("[data-bench]").forEach(el => { el.onclick = () => { const s = el.getAttribute("data-bench-section"); go(el.getAttribute("data-bench"), s ? s : true); }; });
  document.querySelectorAll("[data-run]").forEach(el => { el.onclick = () => { state.modal = { run:el.getAttribute("data-run") }; state.menu = null; render(); }; });
  document.querySelectorAll("[data-file]").forEach(el => { el.onclick = () => { state.modal = { kind:"download", file:el.getAttribute("data-file"), open:el.getAttribute("data-open") }; render(); }; });
  document.querySelectorAll("[data-modal]").forEach(el => { el.onclick = () => { state.modal = { kind:el.getAttribute("data-modal") }; state.menu = null; render(); }; });
  document.querySelectorAll("[data-close]").forEach(el => { el.onclick = () => { state.modal = null; render(); }; });
  document.querySelectorAll("[data-close-bg]").forEach(el => { el.onclick = e => { if (e.target === el) { state.modal = null; render(); } }; });
  document.querySelectorAll("[data-open-project]").forEach(el => { el.onclick = () => { const id = el.getAttribute("data-open-project"), t = toolDefs().find(x => x.key === el.getAttribute("data-open-tool")); state.modal = null; state.menu = null; go(t.key, projectSection(t), id); }; });
  document.querySelectorAll(".nav-sub-item[data-project]").forEach(el => { el.onclick = () => { const t = toolDefs().find(x => x.key === state.view); go(state.view, projectSection(t), el.getAttribute("data-project")); }; });
  document.querySelectorAll("[data-new-project]").forEach(el => { el.onclick = () => { state.modal = { kind:"newproject", tool:el.getAttribute("data-new-project") }; state.menu = null; render(); setTimeout(() => { const i = document.getElementById("np-name"); if (i) i.focus(); }, 50); }; });
  document.querySelectorAll("[data-edit-project]").forEach(el => { el.onclick = () => { state.modal = { kind:"project", id:el.getAttribute("data-edit-project") }; render(); }; });
  const np = document.getElementById("np-save"); if (np) { const start = () => { const name = (document.getElementById("np-name").value || "").trim(); if (!name) return; const t = toolDefs().find(x => x.key === state.modal.tool); state.modal = null; go(t.key, t.sections[0].id, "new:" + name); }; np.onclick = start; document.getElementById("np-form").onsubmit = e => { e.preventDefault(); start(); }; }
  const eps = document.getElementById("ep-save"); if (eps) { const save = () => { const name = (document.getElementById("ep-name").value || "").trim(); if (!name) return; upsertProject({ id:state.modal.id, name }); state.modal = null; render(); }; eps.onclick = save; document.getElementById("ep-form").onsubmit = e => { e.preventDefault(); save(); }; }
  const epd = document.getElementById("ep-delete"); if (epd) epd.onclick = () => { deleteProject(state.modal.id); state.modal = null; render(); };
  const it = document.getElementById("toggle-it"); if (it) it.onclick = () => { const d = document.getElementById("it-details"); d.open = true; d.scrollIntoView({ behavior:"smooth", block:"start" }); };
  const cs = document.getElementById("clear-search"); if (cs) cs.onclick = () => { state.query = ""; render(); };
  const lo = document.getElementById("logout"); if (lo) lo.onclick = logout;
  const la = document.getElementById("logout-all"); if (la) la.onclick = logout;
}
function logout() { state.user = null; state.menu = null; state.modal = null; writeSession(null); location.hash = "#overview"; render(); }

state.user = readSession();
parseHash();
render();
</script>
