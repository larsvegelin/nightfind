<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Moon/Crescent -->
  <circle cx="85" cy="85" r="45" fill="#ffffff" opacity="0.95"/>
  <circle cx="95" cy="75" r="40" fill="#000000"/>
  
  <!-- Magnifying Glass Circle -->
  <circle cx="120" cy="120" r="35" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.95"/>
  
  <!-- Magnifying Glass Handle -->
  <line x1="145" y1="145" x2="175" y2="175" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.95"/>
  
  <!-- Stars (small decorative elements) -->
  <circle cx="50" cy="50" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="140" cy="40" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="165" cy="80" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="35" cy="120" r="2.5" fill="#ffffff" opacity="0.7"/>
  
  <!-- Glow effect -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#glow)">
    <circle cx="85" cy="85" r="45" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.4"/>
    <circle cx="120" cy="120" r="35" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.4"/>
  </g>
</svg>
