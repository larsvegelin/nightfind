name: Huurwoningen scrapen

# Scrapet de huurwoningen (alle bronnen behalve SVNK, die staat standaard uit) en schrijft ze naar Supabase
# (project "scraper", tabellen huur_woningen / huur_bronnen). De pagina huurwoningen.html leest daar live uit.
#
# Geen sleutel nodig: de workflow vraagt een kortlevend OIDC-token aan bij GitHub en schrijft via de
# Supabase Edge Function "huur-import", die alleen deze workflow uit larsvegelin/nightfind accepteert
# (zie scraper/supabase/functions/huur-import). Een repository secret SUPABASE_SERVICE_ROLE_KEY mag ook;
# die heeft dan voorrang.

on:
  schedule:
    # Elke 3 uur tussen ±6:40 en 21:40 Nederlandse tijd (cron is in UTC). Alleen actief op de standaardbranch (main).
    - cron: "41 4-19/3 * * *"
  workflow_dispatch:
  push:
    branches: [main, claude/loving-cerf-3no2e2]
    paths: [".github/workflows/huurwoningen.yml", "scraper/**"]

permissions:
  contents: read
  id-token: write   # voor het GitHub-token waarmee de Edge Function de workflow herkent

concurrency:
  group: huurwoningen-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Installeren (incl. Chromium voor sites die gewone verzoeken blokkeren)
        run: |
          pip install -r scraper/requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Scrapen en naar Supabase schrijven
        run: python -m scraper --supabase aan

      - name: Resultaat bewaren (7 dagen, voor controle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huurwoningen-${{ github.run_number }}
          path: data/huurwoningen.json
          retention-days: 7
          if-no-files-found: ignore
