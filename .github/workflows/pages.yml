name: ParseLab op GitHub Pages

# Zet het statische deel online: dashboard, ParsePDF, ParseBoard, de extensie-download en de docs.
# "Website uitlezen" vanuit het dashboard vraagt de ParseLab-server (zie parselab/Dockerfile); zonder server toont het dashboard dat netjes.
on:
  push:
    branches: [main]   # de omgeving github-pages laat standaard alleen main uitrollen
    paths: ["parselab/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Eerst bouwen en Pages aanzetten (bron: GitHub Actions) als dat nog niet is gebeurd; pas daarna bestaat de omgeving github-pages.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Statische map samenstellen
        run: |
          mkdir -p site
          cp -r parselab/index.html parselab/tools parselab/docs parselab/README.md site/
          rm -rf site/tools/extension/mcp-server/node_modules
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
